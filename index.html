<style>
  :root{--blue:#3fb8ff;--blue-2:#8f9cff;--ice:#eaf6ff;--muted:#8aa3c2;--line:rgba(120,190,255,.2)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ice);font-family:Sora,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}

  /* ===== FUNDO: brilho azul + estrelinhas piscando ===== */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(55% 40% at 50% 22%,rgba(63,184,255,.14),transparent 70%),
      radial-gradient(40% 30% at 85% 95%,rgba(143,156,255,.10),transparent 70%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1px 1px at 12% 18%,#9fd8ff 50%,transparent 51%),
      radial-gradient(1px 1px at 78% 12%,#9fd8ff 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 42%,#b9c3ff 50%,transparent 51%),
      radial-gradient(1px 1px at 6% 62%,#9fd8ff 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 22% 86%,#9fd8ff 50%,transparent 51%),
      radial-gradient(1px 1px at 64% 78%,#b9c3ff 50%,transparent 51%),
      radial-gradient(1px 1px at 45% 6%,#9fd8ff 50%,transparent 51%),
      radial-gradient(1px 1px at 95% 70%,#9fd8ff 50%,transparent 51%);
    animation:estrelas 5s ease-in-out infinite}
  @keyframes estrelas{50%{opacity:.15}}

  .wrap{position:relative;width:100%;max-width:420px;padding:8px 16px 32px;
    display:flex;flex-direction:column;align-items:center;text-align:center}

  /* ===== BODE ===== */
  .stage{position:relative;width:100%}
  .stage::before{content:"";position:absolute;left:15%;right:15%;top:22%;height:45%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(63,184,255,.22),transparent 75%);
    filter:blur(10px);animation:aura 6s ease-in-out infinite}
  @keyframes aura{50%{opacity:.5;transform:scale(1.08)}}
  /* "screen" faz o preto da foto sumir e o bode fica flutuando no fundo da página */
  .bode{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 100%),linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);
    -webkit-mask-composite:source-in;
            mask-image:linear-gradient(to bottom,#000 60%,transparent 100%),linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);
            mask-composite:intersect}
  /* camada que inclina junto com o celular (ou com o mouse no PC) */
  .tilt{position:absolute;inset:0;will-change:transform}
  .bode-in{position:absolute;inset:0;transform:scale(1.06)}
  .bode-in img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 18%}
  @keyframes mexe{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    25%    {transform:translateY(-6px) rotate(-1.5deg) scale(1.02)}
    50%    {transform:translateY(-10px) rotate(0deg) scale(1.03)}
    75%    {transform:translateY(-6px) rotate(1.5deg) scale(1.02)}
  }
  @keyframes brilho-bode{50%{filter:brightness(1.15) saturate(1.3)}}

  /* ===== TEXTOS ===== */
  .info{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
  .tag{margin-top:-18px;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--blue);border:1px solid var(--line);
    background:rgba(0,10,20,.6);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.3}}
  h1{margin-top:14px;font-size:clamp(36px,11vw,46px);font-weight:800;line-height:1;letter-spacing:-.02em}
  h1 span{background:linear-gradient(90deg,var(--blue),var(--blue-2),#c7e9ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(63,184,255,.45))}
  .sub{margin-top:14px;max-width:340px;color:var(--muted);font-size:14.5px;line-height:1.6}
  .sub b{color:var(--ice);font-weight:600}

  /* ===== BOTÕES ===== */
  .btns{width:100%;display:grid;gap:12px;margin-top:26px}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;
    padding:17px 20px;border-radius:16px;text-decoration:none;font-weight:800;font-size:16.5px;
    overflow:hidden;transition:transform .2s,box-shadow .2s,background-color .2s,border-color .2s}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid #c7e9ff;outline-offset:3px}
  .btn svg{width:23px;height:23px;flex:none}
  .btn .seta{width:18px;height:18px;margin-left:auto;opacity:.7;transition:transform .2s}
  .btn .txt{flex:1;text-align:left}
  .btn::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-20deg);animation:brilho 3.6s infinite}
  @keyframes brilho{0%{left:-60%}55%,100%{left:130%}}
  .tg{color:#001221;background:linear-gradient(90deg,#2aa3ff,#57c7ff 50%,var(--blue-2));
    box-shadow:0 10px 40px -8px rgba(63,184,255,.75)}
  .ig{color:var(--ice);background:rgba(63,184,255,.06);border:1.5px solid rgba(63,184,255,.55);
    box-shadow:0 0 24px -6px rgba(63,184,255,.5) inset}
  .ig::before{animation-delay:1.8s}
  @media (hover:hover){
    .btn:hover{transform:translateY(-2px)}
    .btn:hover .seta{transform:translateX(4px)}
    .tg:hover{box-shadow:0 14px 50px -6px rgba(63,184,255,.95)}
    .ig:hover{background:rgba(63,184,255,.14);border-color:var(--blue)}
  }
  .note{margin-top:12px;font-size:12px;color:var(--muted)}
  footer{margin-top:26px;font-size:11px;color:#4f6580}

  /* ===== CELULAR PEQUENO (ex: iPhone SE) ===== */
  @media (max-width:480px) and (max-height:700px){
    .bode{aspect-ratio:1/1}
    h1{font-size:34px}
    .sub{font-size:13.5px}
    .btns{margin-top:20px}
  }

  /* ===== PC / TELA GRANDE ===== */
  @media (min-width:900px){
    .wrap{max-width:1120px;padding:40px 48px;display:grid;grid-template-columns:1.05fr 1fr;
      align-items:center;gap:56px;text-align:left}
    .bode{aspect-ratio:1/1.08;
      -webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 10%,#000 90%,transparent);
              mask-image:linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 10%,#000 90%,transparent)}
    .stage::before{top:20%;height:50%}
    .info{align-items:flex-start;max-width:460px}
    .tag{margin-top:0}
    h1{margin-top:20px;font-size:clamp(52px,5.6vw,72px)}
    .sub{margin-top:18px;max-width:420px;font-size:16.5px}
    .btns{margin-top:34px;max-width:420px}
    .btn{padding:19px 22px;font-size:17px}
    .note{margin-left:2px}
    footer{margin-top:40px}
  }

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<main class="wrap">

<script>
  // ===== Bode se mexe conforme inclina o celular (ou conforme o mouse no PC) =====
  (function(){
    const el = document.getElementById('tilt');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let tx = 0, ty = 0, x = 0, y = 0, base = null;
    const lim = v => Math.max(-1, Math.min(1, v));

    function frame(){
      x += (tx - x) * 0.08; y += (ty - y) * 0.08;   // suaviza o movimento
      el.style.transform =
        `perspective(900px) rotateY(${x * 12}deg) rotateX(${-y * 9}deg) translate(${x * 16}px, ${y * 12}px)`;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // Celular: giroscópio
    function onTilt(e){
      if (e.gamma == null) return;
      if (base === null) base = e.beta;              // posição em que a pessoa segura o celular
      tx = lim(e.gamma / 25);
      ty = lim((e.beta - base) / 25);
    }
    // Android já manda o sensor direto
    addEventListener('deviceorientation', onTilt);
    // iPhone precisa de permissão: é pedida no primeiro toque na página
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      addEventListener('touchend', () => {
        DeviceOrientationEvent.requestPermission().catch(() => {});
      }, { once: true });
    }

    // PC: segue o mouse
    if (matchMedia('(hover: hover)').matches) {
      addEventListener('pointermove', e => {
        tx = lim((e.clientX / innerWidth - 0.5) * 2);
        ty = lim((e.clientY / innerHeight - 0.5) * 2);
      });
      document.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
    }
  })();
</script>
